name: Aggiorna partite

on:
  schedule:
    # GitHub usa UTC. Gli orari non devono essere precisi al minuto:
    # lo scopo è aggiornare il calendario più volte durante la giornata.
    - cron: "17 5 * * *"
    - cron: "17 10 * * *"
    - cron: "17 15 * * *"
    - cron: "17 20 * * *"

  # Permette anche l'avvio manuale dalla scheda Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-partite
  cancel-in-progress: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica la repository
        uses: actions/checkout@v6

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scarica le partite
        run: python scripts/aggiorna_partite.py

      - name: Salva i nuovi dati
        run: |
          if git diff --quiet -- data/partite.json; then
            echo "Nessuna modifica ai dati."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/partite.json
          git commit -m "Aggiorna calendario partite"
          git push
